[package]
name = "oceanfic"
version = "0.0.1"
edition = "2024"
authors = ["fn-a <mr.fna.co@gmail.com>"]
repository = "https://github.com/fn-a/oceanfic"
description = "High-performance maritime asset risk control and intelligent management platform powered by Rust and Bevy Engine"
license = "MIT"

[dependencies]
bevy = "^0.18"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
uuid = { version = "^1.23", features = ["v4"] }
chrono = "^0.4"
thiserror = "^2.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[package]
name = "oceanfic"
version = "0.0.2"
edition = "2024"
authors = ["fn-a <mr.fna.co@gmail.com>"]
repository = "https://github.com/fn-a/oceanfic"
description = "High-performance maritime asset risk control and intelligent management platform powered by Rust and Bevy Engine"
license = "MIT"

[dependencies]
bevy = "^0.19"
anyhow = "^1.0"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"

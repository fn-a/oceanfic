[package]
name = "oceanfic"
version = "0.0.2"
edition = "2024"
authors = ["fn-a <mr.fna.co@gmail.com>"]
repository = "https://github.com/fn-a/oceanfic"
description = "High-performance maritime asset risk control and intelligent management platform powered by Rust and Bevy Engine"
license = "MIT"
exclude = ["assets/*.bin"]

[dependencies]
bevy = "^0.19"
anyhow = "^1.0"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
ureq = { version = "^3.5", default-features = false, features = ["native-tls", "gzip"] }
zip = { version = "^4.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
